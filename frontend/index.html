<!DOCTYPE html>
<html>
<head>
  <title>URL Shortener</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background: #0f172a;
      color: white;
    }
    input {
      padding: 10px;
      width: 300px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>🔗 URL Shortener</h1>

<input id="urlInput" placeholder="Enter URL" />
<button onclick="shorten()">Shorten</button>

<div id="result"></div>

<script>
async function shorten() {
  const url = document.getElementById("urlInput").value;

  const res = await fetch(`http://url-shortener-service/shorten?url=${encodeURIComponent(url)}`);
  const data = await res.text();

  document.getElementById("result").innerHTML =
    `<a href="${data}" target="_blank">${data}</a>`;
}
</script>

</body>
</html>
