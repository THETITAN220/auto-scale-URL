apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-frontend
  template:
    metadata:
      labels:
        app: url-frontend
    spec:
      containers:
        - name: frontend
          image: raunistotle/url-frontend:latest
          ports:
            - containerPort: 80